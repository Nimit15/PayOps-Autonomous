# Render Blueprint Configuration for PayOps Autonomous
# Monorepo deployment: Next.js web app + background workflows
# Optimized for $50 Render credits - minimal resource usage

services:
  # Main Next.js Web Application
  - type: web
    name: payops-autonomous-web
    runtime: node
    repo: https://github.com/your-org/payops-autonomous
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_DEFAULT_COUNTRY
        value: US
      - key: CHANNEL3_DEFAULT_CURRENCY
        value: USD
      - key: CHANNEL3_DEFAULT_LANGUAGE
        value: en
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: payops-autonomous-web
          property: host
    autoDeploy: true
    plan: starter

  # Background Workflows - handles webhook processing, scheduled tasks, reconciliation
  - type: workflow
    name: payops-autonomous-workflows
    runtime: node
    repo: https://github.com/your-org/payops-autonomous
    branch: main
    buildCommand: npm install
    startCommand: npm run start --workspace=apps/workflows
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CHANNEL3_API_KEY
        sync: false
    autoDeploy: true

# No Redis - using in-memory/simple caching to stay within $50 credits
# No autoscaling - starter plan handles expected load
# No separate cron job - workflows handle scheduled tasks

# Environment Groups (set these in Render Dashboard → Environment Groups)
# payops-secrets: PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID, CHANNEL3_API_KEY

# Deployment hooks (configure in Render Dashboard)
# Pre-deploy: npm run paypal:doctor (verify deployment)
# Post-deploy: curl https://<app>.onrender.com/api/health (verify health endpoint)